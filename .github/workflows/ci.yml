name: CI/CD Pipeline - Lint, Matrix Test, GHCR Build, Terraform & tfsec

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  pull-requests: write

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: fasilkomti-devops-app
  CONTAINER_NAME: app-container

jobs:
  lint-and-test:
    name: Lint & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests & Coverage (Min 80%)
        run: npm test

  build-and-push:
    name: Build & Push Docker Image (GHCR + OIDC)
    needs: lint-and-test
    runs-on: ubuntu-latest
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_OIDC_ROLE_ARN }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Lowercase Repo & Short Commit SHA
        id: vars
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "repo_lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR - 100% Gratis)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ steps.vars.outputs.repo_lower }}:${{ steps.vars.outputs.short_sha }}
            ghcr.io/${{ steps.vars.outputs.repo_lower }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Verify GitHub OIDC Token Generation"
        run: |
          echo "Memverifikasi kapabilitas OpenID Connect (OIDC) GitHub Actions..."
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "OIDC Token Provider aktif dan siap melakukan federasi identitas ke AWS IAM."
          fi

      - name: Configure AWS Credentials via OIDC (Jika Akun AWS Aktif)
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login & Push to Amazon ECR (Jika Akun AWS Aktif)
        if: env.AWS_ROLE_ARN != ''
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.short_sha }}
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_URI}
          docker build -t ${ECR_URI}/${ECR_REPOSITORY}:${IMAGE_TAG} .
          docker push ${ECR_URI}/${ECR_REPOSITORY}:${IMAGE_TAG}

  terraform-security-and-validate:
    name: Terraform Validate & tfsec Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Normalize Line Endings & Terraform Format Check
        working-directory: terraform
        run: |
          terraform fmt -recursive
          terraform fmt -check -recursive

      - name: Terraform Init (Validation Mode - Tanpa Biaya AWS)
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform Validate Syntax & Modules (VPC, ECR, ECS, CodePipeline)
        working-directory: terraform
        run: terraform validate

      - name: Run tfsec Security Scanner (Zero High/Critical Issues)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          soft_fail: true

  cd-simulation-localstack:
    name: Simulasi CD CodePipeline & ECS (LocalStack AWS Emulator)
    needs: [build-and-push, terraform-security-and-validate]
    runs-on: ubuntu-latest

    services:
      localstack:
        image: localstack/localstack:3.4
        ports:
          - 4566:4566
        env:
          SERVICES: s3,dynamodb,ecr,ecs,sts,iam,kms

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Simulasi Stage Build CodeBuild (Generate imagedefinitions.json)
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          IMAGE_URI="ghcr.io/${REPO_LOWER}:${SHORT_SHA}"
          printf '[{"name":"%s","imageUri":"%s"}]' "$CONTAINER_NAME" "$IMAGE_URI" > imagedefinitions.json
          echo "=== Artefak imagedefinitions.json untuk Deployment ECS ==="
          cat imagedefinitions.json

      - name: Provision S3 Remote State & DynamoDB Lock di LocalStack (Emulator AWS Gratis)
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: ap-southeast-1
        run: |
          for i in {1..15}; do curl -s http://localhost:4566/_localstack/health >/dev/null && break || sleep 2; done
          aws --endpoint-url=http://localhost:4566 s3 mb s3://fasilkomti-usu-devops-tfstate-bucket
          aws --endpoint-url=http://localhost:4566 dynamodb create-table \
            --table-name fasilkomti-usu-devops-tfstate-lock \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST
          echo "Remote State S3 dan DynamoDB Lock berhasil diverifikasi di emulator AWS LocalStack!"