version: 0.2

phases:
  install:
    commands:
      - echo "Menginstal jq dan memverifikasi AWS CLI..."
      - yum install -y jq
  pre_build:
    commands:
      - echo "Mengambil informasi commit SHA dari GitHub Actions..."
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:=latest}
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - REPOSITORY_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPOSITORY_NAME}
  build:
    commands:
      - echo "Membuat imagedefinitions.json untuk deployment ECS Fargate dengan image ${REPOSITORY_URI}:${IMAGE_TAG}..."
      - printf '[{"name":"%s","imageUri":"%s"}]' "$CONTAINER_NAME" "$REPOSITORY_URI:$IMAGE_TAG" > imagedefinitions.json
      - cat imagedefinitions.json
artifacts:
  files:
    - imagedefinitions.json
